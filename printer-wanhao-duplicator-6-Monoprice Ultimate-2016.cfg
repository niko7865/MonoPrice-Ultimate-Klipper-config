# Wanhao Duplicator 6 / Monoprice Ultimate (Ultimainboard v2 clone, ATmega2560)
#
# Build the Klipper firmware with `make menuconfig`:
#   Micro-controller: Atmega AVR, Processor model: atmega2560,
#   Processor speed: 16MHz, communication: serial (USB) at 250000 baud.
#
# Pin assignments are taken from the original Marlin firmware
# (https://github.com/garychen99/Duplicator-6-firmware-version-3.1,
# pins.h, MOTHERBOARD 72). Klipper no longer supports Arduino pin
# names, so the original "arNN"/"analogNN" names are noted next to
# each hardware pin name below.
#
# See https://www.klipper3d.org/Config_Reference.html for a description
# of every parameter.

[mcu]
# Find your printer's id with: ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-Arduino__www.arduino.cc__Arduino_Mega_2560_9563231343435161A1D1-if00
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# Motion
#
# Marlin DEFAULT_AXIS_STEPS_PER_UNIT { 80.0395, 80.0395, 400.48, 99.1 }
# with 1.8 degree motors and 16 microsteps:
#   rotation_distance = 200 * 16 / steps_per_mm
# X/Y use the nominal 40mm (20 tooth GT2 pulley), Z is an 8mm lead screw.

[stepper_x]
step_pin: PA3              # ar25
dir_pin: !PA1              # ar23
enable_pin: !PA5           # ar27
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PA0         # ar22
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PC5              # ar32
dir_pin: PC4               # ar33
enable_pin: !PC6           # ar31
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PA4         # ar26
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PC2              # ar35
dir_pin: !PC1              # ar36
enable_pin: !PC3           # ar34
microsteps: 16
rotation_distance: 8
endstop_pin: ^!PA7         # ar29
position_endstop: 0.5
position_max: 175
homing_speed: 25

[extruder]
step_pin: PL7              # ar42
dir_pin: !PL6              # ar43
enable_pin: !PC0           # ar37
microsteps: 16
# 200 * 16 / 99.1 steps/mm. Calibrate for your extruder:
# https://www.klipper3d.org/Rotation_Distance.html#calibrating-rotation_distance-on-extruders
rotation_distance: 32.291
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.15
heater_pin: PE4            # ar2
sensor_type: PT100 INA826
sensor_pin: PK0            # analog8
control: pid
pid_Kp: 26.571
pid_Ki: 0.927
pid_Kd: 190.318
min_extrude_temp: 170
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PG5            # ar4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK2            # analog10
control: pid
pid_Kp: 59.593
pid_Ki: 3.01
pid_Kd: 294.985
min_temp: 0
max_temp: 110

[fan]
pin: PH4                   # ar7

# Stepper driver current
#
# The board sets the A4988 reference voltage with PWM. In Marlin the
# full scale is MOTOR_CURRENT_PWM_RANGE 2782mA, so 'value' is in amps.
# Change it at run time with e.g. SET_PIN PIN=stepper_xy_current VALUE=1.0

[output_pin stepper_xy_current]
pin: PL5                   # ar44
pwm: True
scale: 2.782
cycle_time: .000030
hardware_pwm: True
value: 1.2

[output_pin stepper_z_current]
pin: PL4                   # ar45
pwm: True
scale: 2.782
cycle_time: .000030
hardware_pwm: True
value: 1.2

[output_pin stepper_e_current]
pin: PL3                   # ar46
pwm: True
scale: 2.782
cycle_time: .000030
hardware_pwm: True
value: 1.0

# Front panel: SSD1309 OLED on the hardware i2c bus (PD0/PD1) with a
# rotary encoder.

[display]
lcd_type: ssd1306
reset_pin: PE3             # ar5
encoder_pins: ^PG1, ^PG0   # ar40, ar41
click_pin: ^!PD2           # ar19

# Case LEDs

[output_pin caselight]
pin: PH5                   # ar8
pwm: True
value: 0

[gcode_macro LIGHTS_ON]
gcode:
    SET_PIN PIN=caselight VALUE=1

[gcode_macro LIGHTS_OFF]
gcode:
    SET_PIN PIN=caselight VALUE=0

# Host features used by Mainsail, Fluidd and OctoPrint

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[exclude_object]

[respond]
